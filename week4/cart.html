<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: auto;
        }

        .item {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 0 5px gray;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            color: green;
        }

        button {
            padding: 8px 15px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkred;
        }

        a {
            text-decoration: none;
        }
    </style>

    <script>
        function loadCart() {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            let output = "";
            let total = 0;

            if(cart.length === 0) {
                output = "Cart is empty";
            } else {
                for(let i = 0; i < cart.length; i++) {
                    output += "<div class='item'>" +
                              cart[i].name + " - Rs." + cart[i].price +
                              "</div>";
                    total += cart[i].price;
                }

                output += "<div class='total'>Total: Rs." + total + "</div>";
            }

            document.getElementById("cart").innerHTML = output;
        }

        function clearCart() {
            localStorage.removeItem("cart");
            loadCart();
        }
    </script>
</head>

<body onload="loadCart()">

<div class="container">

<h2>Your Cart</h2>

<div id="cart"></div>

<br>

<button onclick="clearCart()">Clear Cart</button>

<br><br>

<a href="index.html">Back to Shop</a>

</div>

</body>
</html>
